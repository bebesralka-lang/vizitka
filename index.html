<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQST — Портфолио сайтов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Georgia', 'Segoe UI', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            position: relative;
            background: #ac3c64; /* запасной цвет, если фото не загрузится */
        }

        /* ===== ФОНОВОЕ ФОТО ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('photo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.5) blur(2px);
            z-index: 0;
        }

        /* ===== КАРТОЧКА (поверх фона) ===== */
        .card {
            max-width: 700px;
            width: 100%;
            background: rgba(220, 156, 179, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 40px 30px 45px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            text-align: center;
            position: relative;
            z-index: 1;
            transition: 0.3s;
        }
        .card:hover {
            box-shadow: 0 20px 60px rgba(255,255,255,0.1);
        }

        .logo {
            font-size: 3.2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 30px rgba(0,0,0,0.3);
            letter-spacing: 8px;
        }
        .logo small {
            display: block;
            font-size: 1rem;
            letter-spacing: 3px;
            opacity: 0.9;
            margin-top: 4px;
            font-weight: normal;
            color: #fff;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #f5e6ed;
            margin: 15px 0 20px;
            font-style: italic;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .examples {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }
        .example-item {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(4px);
            border-radius: 16px;
            padding: 18px 8px;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            font-size: 0.9rem;
            font-weight: bold;
            transition: 0.3s;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .example-item:hover {
            background: rgba(255,255,255,0.25);
            transform: scale(1.03);
        }
        .example-item .icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 4px;
        }

        .price-line {
            color: #f5e6ed;
            font-size: 0.95rem;
            margin: 10px 0 5px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .btn {
            display: inline-block;
            background: rgba(172, 84, 113, 0.85);
            backdrop-filter: blur(4px);
            color: #fff;
            padding: 14px 45px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 15px;
            transition: 0.3s;
            box-shadow: 0 6px 25px rgba(0,0,0,0.2);
            font-family: 'Georgia', serif;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn:hover {
            background: #5f182d;
            transform: scale(1.03);
        }

        .footer-text {
            color: #f5e6ed;
            font-size: 0.9rem;
            margin-top: 20px;
            opacity: 0.85;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .highlight {
            background: rgba(255,255,255,0.1);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            backdrop-filter: blur(4px);
        }

        @media (max-width: 500px) {
            .examples {
                grid-template-columns: 1fr 1fr;
            }
            .logo {
                font-size: 2.4rem;
            }
            .card {
                padding: 25px 18px 30px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">
            SQST
            <small>создаю сайты о любви и не только</small>
        </div>

        <div class="subtitle">
            ✦ смотри, вдохновляйся, заказывай ✦
        </div>

        <div class="examples">
            <div class="example-item">
                <span class="icon">💕</span>
                Сайт-свидание
            </div>
            <div class="example-item">
                <span class="icon">📸</span>
                Портфолио
            </div>
            <div class="example-item">
                <span class="icon">🎵</span>
                Сайт с плейлистом
            </div>
            <div class="example-item">
                <span class="icon">📍</span>
                Сайт с картой
            </div>
            <div class="example-item">
                <span class="icon">💌</span>
                Письмо в будущее
            </div>
            <div class="example-item">
                <span class="icon">🎡</span>
                Парк аттракционов
            </div>
        </div>

        <div class="price-line">
            🔥 от 150 ₽ · за 1 день · с душой
        </div>

        <a href="https://t.me/ssqwst" target="_blank" class="btn">
            💬 Написать в Telegram
        </a>

        <div class="footer-text">
            <span class="highlight">🤍 покажу примеры до оплаты</span>
            <br>
            предоплата 50% · правки бесплатно
        </div>
    </div>

</body>
</html>
